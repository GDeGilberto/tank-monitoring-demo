# Demo de monitoreo de tanques: web (dashboard) + api (jobs y simulador) + PostgreSQL.
# Un solo puerto expuesto (web), enlazado a 127.0.0.1 por defecto: un tunel (cloudflared) en el
# mismo equipo apunta a http://localhost:${WEB_PORT}. La API y la base solo existen en la red interna.
#
#   cp .env.example .env   # y completar los valores
#   docker compose up -d --build
name: tank-monitoring-demo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-UTC}
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c work_mem=4MB
      -c effective_cache_size=128MB
      -c synchronous_commit=off
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [backend]

  api:
    build:
      context: .
      target: api
    image: tank-monitoring-api:demo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      TZ: ${TZ:-UTC}
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-monitoring};Username=${POSTGRES_USER:-monitoring};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__HangfireConnection: Host=db;Database=${POSTGRES_DB:-monitoring};Username=${POSTGRES_USER:-monitoring};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env (minimo 32 caracteres)}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    networks: [backend]

  web:
    build:
      context: .
      target: web
    image: tank-monitoring-web:demo
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      TZ: ${TZ:-UTC}
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-monitoring};Username=${POSTGRES_USER:-monitoring};Password=${POSTGRES_PASSWORD}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m
    networks: [backend]

networks:
  backend:

volumes:
  dbdata:
